[package]
name = "reverse-attach"
version = "0.4.0"
edition = "2021"

[dependencies]
serde_json = "1"
base64 = "0.22"
tungstenite = { version = "0.24", features = ["rustls-tls-native-roots"] }
# Already in the tree through tungstenite; named here so (1) rustls gets a crypto
# provider (without one every wss:// dial panicked in rustls) and (2) the mint
# client can speak https:// with the same native roots.
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
rustls-native-certs = "0.7"

# Windows backend (POC). Target-specific: none of these are built for Linux.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Registry",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_StationsAndDesktops",
    "Win32_System_Threading",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_Ime",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
png = "0.17"
jpeg-encoder = "0.6"
