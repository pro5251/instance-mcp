[package]
name = "reverse-attach"
version = "0.4.0"
edition = "2021"

[dependencies]
serde_json = "1"
base64 = "0.22"
tungstenite = { version = "0.24", features = ["rustls-tls-native-roots"] }
# Already in the tree through tungstenite; named here so (1) rustls gets a crypto
# provider (without one every wss:// dial panicked in rustls) and (2) the mint
# client can speak https:// with the same native roots.
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
rustls-native-certs = "0.7"
