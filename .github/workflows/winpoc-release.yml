name: Release Windows POC ZIP (fork only)

# FORK-ONLY (pro5251/instance-mcp). Exclude this file from upstream PRs: upstream ships the
# Windows ZIP from release.yml's `windows` job. That job waits for the macOS job to create
# the release, which needs Apple signing secrets a fork does not have, so a fork can never
# publish a Windows ZIP through it.
#
# Same packaging as release.yml's `windows` job; only the trigger, the tag prefix and the
# release creation differ. scripts/setup-winpoc.ps1 installs the newest winpoc-v* release.

on:
  push:
    tags: ["winpoc-v*"]
  workflow_dispatch:
    # Dispatch on the tag ref: `gh workflow run winpoc-release.yml --ref winpoc-vX -f tag=winpoc-vX`.
    inputs:
      tag:
        description: "Existing winpoc-v* tag to (re)build and upload"
        required: true
        type: string

# No `environment:` gate: the author's `release` environment admits v* refs only, and on a
# fork only the owner can push tags.
permissions:
  contents: write

concurrency:
  group: winpoc-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  windows:
    name: Windows hands node ZIP (POC, x64, MSVC static CRT)
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - name: Check the tag
        shell: bash
        run: |
          case "$RELEASE_TAG" in
            winpoc-v*) ;;
            *) echo "tag must start with winpoc-v (got '$RELEASE_TAG')" >&2; exit 1;;
          esac
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Toolchain (rustup is preinstalled on windows-latest)
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --target x86_64-pc-windows-msvc
          rustup default stable
      - name: Build (MSVC, static CRT)
        working-directory: poc/reverse-attach-linux
        run: cargo build --release --target x86_64-pc-windows-msvc
      - name: Check the exe needs no VC runtime DLL
        shell: pwsh
        working-directory: poc/reverse-attach-linux
        run: |
          $bytes = [IO.File]::ReadAllBytes("target/x86_64-pc-windows-msvc/release/reverse-attach.exe")
          $text = [Text.Encoding]::ASCII.GetString($bytes)
          foreach ($dll in 'vcruntime140.dll','vcruntime140_1.dll','msvcp140.dll','api-ms-win-crt-runtime') {
            if ($text.IndexOf($dll, [StringComparison]::OrdinalIgnoreCase) -ge 0) { throw "exe imports $dll; static CRT did not apply" }
          }
          Write-Host "no VC runtime imports"
      - name: Package
        shell: pwsh
        working-directory: poc/reverse-attach-linux
        run: |
          $ver = "${env:RELEASE_TAG}" -replace '^winpoc-v',''
          $name = "oab-imcp-winpoc-$ver-windows-amd64"
          New-Item -ItemType Directory -Force $name | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/reverse-attach.exe "$name/oab-imcp-winpoc.exe"
          Copy-Item windows/install-winpoc.ps1,windows/install.cmd,windows/uninstall.cmd,windows/pw-mcp.ps1 $name/
          Copy-Item windows/README.md "$name/README.md"
          Compress-Archive -Path "$name/*" -DestinationPath "$name.zip" -Force
          (Get-FileHash "$name.zip" -Algorithm SHA256).Hash.ToLower() + "  $name.zip" |
            Set-Content "$name.zip.sha256"
          "ASSET=$name.zip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding ascii
      - name: Create the prerelease (or reuse it) and upload
        shell: bash
        working-directory: poc/reverse-attach-linux
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --prerelease \
              --title "$RELEASE_TAG (Windows POC)" \
              --notes "Windows hands node POC (unsigned). Install: clone the repo and double-click scripts/setup-winpoc.cmd; see docs/windows-setup.md."
          fi
          gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --clobber \
            "$ASSET" "$ASSET.sha256"
